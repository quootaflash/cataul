<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Proteksi Zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Market - Exclusive Deals</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES (High Contrast untuk Sales) --- */
        :root {
            --primary: #2563eb;       /* Biru Brand */
            --primary-dark: #1e40af;
            
            /* Warna Impuls (Merah Sales) */
            --sales: #dc2626;         
            --sales-bg: #fef2f2;
            
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        img { display: block; max-width: 100%; }
        button, input, select { font-family: inherit; border: none; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .hidden { display: none !important; }

        /* --- HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 0;
        }

        .nav-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 30px; }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: var(--text-main); }
        .logo img { height: 32px; }

        .search-box { flex: 1; max-width: 500px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 45px; border-radius: 50px; background: var(--bg-body); border: 1px solid transparent;
            transition: var(--transition);
        }
        .search-box input:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .nav-actions { display: flex; gap: 24px; align-items: center; }
        
        .icon-btn { position: relative; color: var(--text-main); font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { color: var(--primary); transform: scale(1.1); }
        
        /* Badge Keranjang */
        .badge-count {
            position: absolute; top: -8px; right: -8px;
            background: var(--sales); color: white;
            font-size: 0.7rem; font-weight: 700;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white;
        }

        /* --- HERO SLIDER --- */
        .hero-section {
            margin-top: 24px; position: relative; width: 100%; aspect-ratio: 21/9;
            background: #e2e8f0; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-md);
        }
        .slider-container { width: 100%; height: 100%; position: relative; }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slider-dots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; }
        .dot.active { background: white; width: 24px; border-radius: 4px; }

        /* --- FILTER BAR --- */
        .filter-bar { display: flex; gap: 10px; margin: 24px 0; overflow-x: auto; padding-bottom: 5px; }
        .filter-chip {
            padding: 8px 16px; background: white; border: 1px solid var(--border); border-radius: 50px;
            font-size: 0.9rem; font-weight: 500; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: var(--transition);
        }
        .filter-chip.active, .filter-chip:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: var(--shadow-sm); }

        /* --- PRODUCT GRID --- */
        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 60px;
        }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }

        /* --- CARD DESIGN (Impulse Buy Focus) --- */
        .cv-card {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
            overflow: hidden; transition: var(--transition); position: relative; cursor: pointer;
            display: flex; flex-direction: column;
        }
        .cv-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--primary); }

        .card-image { position: relative; padding-top: 100%; background: #f1f5f9; overflow: hidden; }
        .card-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .cv-card:hover .card-image img { transform: scale(1.08); }

        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; z-index: 2; }
        
        /* Action Buttons on Hover */
        .card-actions {
            position: absolute; bottom: 10px; right: 10px; z-index: 2;
            display: flex; gap: 8px; opacity: 0; transform: translateY(10px); transition: 0.3s;
        }
        .cv-card:hover .card-actions { opacity: 1; transform: translateY(0); }

        .btn-icon-card {
            width: 32px; height: 32px; border-radius: 50%; background: white; color: var(--text-main);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: var(--shadow-md); transition: 0.2s;
        }
        .btn-icon-card:hover { color: var(--sales); transform: scale(1.1); }
        .btn-icon-card.liked { color: var(--sales); background: var(--sales-bg); }

        .card-content { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; line-height: 1.4; height: 2.6rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        /* HARGA IMPULSIF */
        .price-container { margin-top: auto; }
        .original-price { font-size: 0.8rem; color: var(--text-muted); text-decoration: line-through; margin-bottom: 2px; }
        .current-price { font-size: 1.25rem; font-weight: 800; color: var(--sales); line-height: 1.2; }
        .discount-tag {
            font-size: 0.75rem; color: var(--sales); font-weight: 700; background: var(--sales-bg);
            padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px;
        }

        .sold-info { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000;
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: white; width: 100%; max-width: 900px; border-radius: 20px; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-body { display: flex; flex-direction: column; overflow-y: auto; max-height: 90vh; }
        @media (min-width: 768px) {
            .modal-body { flex-direction: row; height: 500px; }
            .modal-img { width: 50%; }
            .modal-info { width: 50%; padding: 32px; }
        }
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal-cat { color: var(--primary); font-weight: 600; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 8px; }
        .modal-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; line-height: 1.2; }
        
        .modal-price-box { background: var(--sales-bg); padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(220, 38, 38, 0.1); }
        .modal-original { font-size: 0.9rem; color: var(--text-muted); text-decoration: line-through; }
        .modal-current { font-size: 1.8rem; font-weight: 800; color: var(--sales); }

        .modal-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; flex: 1; overflow-y: auto; }
        
        .btn-buy {
            width: 100%; background: var(--sales); color: white; padding: 16px; border-radius: 12px;
            font-weight: 700; font-size: 1.1rem; text-align: center; cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(220, 38, 38, 0.39);
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
            position: relative; overflow: hidden;
        }
        .btn-buy:hover { background: #b91c1c; transform: translateY(-2px); box-shadow: 0 6px 20px 0 rgba(220, 38, 38, 0.23); }
        .btn-buy:active { transform: translateY(0); }

        /* Animasi Pulse untuk tombol beli */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .btn-pulse { animation: pulse-red 2s infinite; }

        .btn-close { position: absolute; top: 20px; right: 20px; background: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: var(--shadow-md); }

        /* Footer */
        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 0.9rem; background: white; }

        /* TOAST NOTIF */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #10b981; color: white; padding: 12px 24px; border-radius: 50px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 2000;
            display: flex; align-items: center; gap: 10px; font-weight: 500;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Header -->
    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="Logo">
                <span>CV Market</span>
            </a>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari template impian...">
            </div>

            <div class="nav-actions">
                <div class="icon-btn" onclick="openWishlist()">
                    <i class="far fa-heart"></i>
                </div>
                <div class="icon-btn" onclick="openCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <div class="badge-count hidden" id="cartBadge">0</div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Hero Slider -->
        <section class="hero-section" id="heroSlider">
            <div class="slider-container" id="sliderTrack"></div>
            <div class="slider-dots" id="sliderDots"></div>
        </section>

        <!-- Filter Chips -->
        <div class="filter-bar">
            <div class="filter-chip active" onclick="setCategory('all', this)">Semua</div>
            <div class="filter-chip" onclick="setCategory('Creative', this)">Creative</div>
            <div class="filter-chip" onclick="setCategory('Formal', this)">Formal</div>
            <div class="filter-chip" onclick="setCategory('Tech', this)">Tech</div>
            <div class="filter-chip" onclick="setCategory('Simple', this)">Minimalis</div>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid"></div>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 CV Market. Premium Template Store.</p>
        </div>
    </footer>

    <!-- MODAL DETAIL PRODUK -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
            <div class="modal-body">
                <div class="modal-img">
                    <img id="m-image" src="" alt="">
                </div>
                <div class="modal-info">
                    <div id="m-cat" class="modal-cat">CATEGORY</div>
                    <h2 id="m-title" class="modal-title">Product Title</h2>
                    
                    <div class="modal-price-box">
                        <div class="modal-original" id="m-original">Rp 150.000</div>
                        <div class="modal-current" id="m-price">Rp 75.000</div>
                    </div>

                    <p id="m-desc" class="modal-desc">Description...</p>
                    
                    <div style="margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted);">
                        <i class="fas fa-fire" style="color:orange"></i> <span id="m-sold">0</span> orang membeli produk ini hari ini
                    </div>

                    <button id="m-btn-buy" class="btn-buy btn-pulse">
                        <i class="fab fa-whatsapp"></i> BELI SEKARANG
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i> <span id="toastMsg">Berhasil!</span>
    </div>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // --- KONFIGURASI ---
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';
        const ADMIN_WA = '6281234567890';

        let supabase;
        let useSupabase = false;

        if (SUPABASE_URL.length > 10 && SUPABASE_ANON_KEY.length > 10) {
            try { supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY); useSupabase = true; } catch(e) {}
        }

        // --- STATE MANAGEMENT (LOCAL STORAGE) ---
        let wishlist = JSON.parse(localStorage.getItem('cv_wishlist')) || [];
        let cart = JSON.parse(localStorage.getItem('cv_cart')) || [];
        let products = [];
        let filteredProducts = [];
        let currentCategory = 'all';

        // --- DATA DUMMY (Dengan Harga Coret untuk Psikologi) ---
        // original_price = Harga asli (tampil dicoret)
        // price = Harga jual (merah besar)
        const dummyData = [
            { id: 1, title: "Ultimate Creative Portfolio", category: "Creative", price: 49000, original_price: 99000, sold_count: 850, description: "Template desainer profesional dengan layout asimetris.", image: "https://picsum.photos/seed/sales1/600/600" },
            { id: 2, title: "Executive Corporate Gold", category: "Formal", price: 79000, original_price: 150000, sold_count: 420, description: "CV formal untuk level direksi dan manajer.", image: "https://picsum.photos/seed/sales2/600/600" },
            { id: 3, title: "Tech Developer Pro", category: "Tech", price: 89000, original_price: 180000, sold_count: 1200, description: "Tema gelap untuk developer, kode rapi.", image: "https://picsum.photos/seed/sales3/600/600" },
            { id: 4, title: "Fresh Graduate Starter", category: "Simple", price: 29000, original_price: 75000, sold_count: 2500, description: "Paling laris! Simpel dan mudah diedit.", image: "https://picsum.photos/seed/sales4/600/600" },
            { id: 5, title: "Marketing Master Kit", category: "Creative", price: 59000, original_price: 120000, sold_count: 340, description: "Fokus pada penjualan dan data.", image: "https://picsum.photos/seed/sales5/600/600" },
            { id: 6, title: "Finance Specialist", category: "Formal", price: 69000, original_price: 140000, sold_count: 210, description: "Struktur data keuangan yang rapi.", image: "https://picsum.photos/seed/sales6/600/600" }
        ];

        const sliderData = [
            { image: 'https://picsum.photos/seed/bannerA/1200/500', link: '#' },
            { image: 'https://picsum.photos/seed/bannerB/1200/500', link: '#' }
        ];

        // --- INIT ---
        async function init() {
            initSlider();
            await fetchProducts();
            updateCartBadge();
            renderProducts();
        }

        // --- SLIDER LOGIC ---
        function initSlider() {
            const track = document.getElementById('sliderTrack');
            const dots = document.getElementById('sliderDots');
            sliderData.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i===0?'active':''}`;
                div.innerHTML = `<img src="${s.image}" loading="lazy">`;
                track.appendChild(div);
                const dot = document.createElement('div');
                dot.className = `dot ${i===0?'active':''}`;
                dot.onclick = () => { document.querySelectorAll('.slide').forEach(e=>e.classList.remove('active')); document.querySelectorAll('.dot').forEach(e=>e.classList.remove('active')); div.classList.add('active'); dot.classList.add('active'); };
                dots.appendChild(dot);
            });
        }

        // --- FETCH DATA ---
        async function fetchProducts() {
            if (useSupabase) {
                const { data, error } = await supabase.from('cvs').select('*');
                if (data) products = data;
                else products = dummyData;
            } else {
                await new Promise(r => setTimeout(r, 500));
                products = dummyData;
            }
            filterLogic();
        }

        // --- RENDER PRODUK ---
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(filteredProducts.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;color:#888;">Produk tidak ditemukan</p>';
                return;
            }

            filteredProducts.forEach(p => {
                const isLiked = wishlist.includes(p.id);
                
                // Hitung diskon persen untuk display
                const discount = Math.round(((p.original_price - p.price) / p.original_price) * 100);

                const card = document.createElement('div');
                card.className = 'cv-card';
                card.innerHTML = `
                    <div class="card-image" onclick="window.openModalById(${p.id})">
                        <span class="badge">${p.category}</span>
                        <img src="${p.image}" loading="lazy">
                        <div class="card-actions">
                            <div class="btn-icon-card ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); window.toggleWishlist(${p.id})">
                                <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                            </div>
                            <div class="btn-icon-card" onclick="event.stopPropagation(); window.addToCart(${p.id})">
                                <i class="fas fa-cart-plus"></i>
                            </div>
                        </div>
                    </div>
                    <div class="card-content" onclick="window.openModalById(${p.id})">
                        <h3 class="card-title">${p.title}</h3>
                        
                        <div class="price-container">
                            <div class="discount-tag">${discount}% OFF</div>
                            <div class="original-price">Rp ${p.original_price.toLocaleString('id-ID')}</div>
                            <div class="current-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                            <div class="sold-info"><i class="fas fa-bolt"></i> ${p.sold_count} Terjual</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- LOGIC FILTER ---
        window.setCategory = function(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterLogic();
        }

        function filterLogic() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            filteredProducts = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchText = p.title.toLowerCase().includes(q);
                return matchCat && matchText;
            });
            renderProducts();
        }

        document.getElementById('searchInput').addEventListener('input', filterLogic);

        // --- LOGIC WISHLIST ---
        window.toggleWishlist = function(id) {
            const index = wishlist.indexOf(id);
            if (index === -1) {
                wishlist.push(id);
                showToast("Ditambahkan ke Favorit ❤️");
            } else {
                wishlist.splice(index, 1);
                showToast("Dihapus dari Favorit");
            }
            localStorage.setItem('cv_wishlist', JSON.stringify(wishlist));
            renderProducts(); // Re-render untuk update icon hati
        }

        window.openWishlist = function() {
            if(wishlist.length === 0) return showToast("Wishlist kosong");
            // Filter tampilan hanya wishlist
            filteredProducts = products.filter(p => wishlist.includes(p.id));
            // Reset chip UI visual saja (opsional)
            renderProducts();
            document.getElementById('productGrid').scrollIntoView({behavior:'smooth'});
        }

        // --- LOGIC CART ---
        window.addToCart = function(id) {
            // Cek duplikat
            if(cart.some(item => item.id === id)) {
                return showToast("Sudah ada di keranjang");
            }
            const product = products.find(p => p.id === id);
            cart.push(product);
            localStorage.setItem('cv_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast("Masuk Keranjang 🛒");
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            if (cart.length > 0) {
                badge.innerText = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.openCart = function() {
            if(cart.length === 0) return showToast("Keranjang kosong");
            // Buat pesan WA dari isi keranjang
            let msg = "Halo Admin, saya ingin memesan:\n";
            let total = 0;
            cart.forEach(item => {
                msg += `- ${item.title} (Rp ${item.price.toLocaleString('id-ID')})\n`;
                total += item.price;
            });
            msg += `\nTotal: Rp ${total.toLocaleString('id-ID')}`;
            
            const url = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // --- MODAL ---
        window.openModalById = function(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            
            document.getElementById('m-image').src = p.image;
            document.getElementById('m-cat').innerText = p.category;
            document.getElementById('m-title').innerText = p.title;
            document.getElementById('m-original').innerText = "Rp " + p.original_price.toLocaleString('id-ID');
            document.getElementById('m-price').innerText = "Rp " + p.price.toLocaleString('id-ID');
            document.getElementById('m-desc').innerText = p.description || "";
            document.getElementById('m-sold').innerText = p.sold_count;
            
            document.getElementById('m-btn-buy').onclick = () => {
                const msg = `Halo, saya beli *${p.title}* - Promo Rp ${p.price.toLocaleString('id-ID')}`;
                window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`, '_blank');
            };

            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('productModal').addEventListener('click', (e) => {
            if(e.target.id === 'productModal') closeModal();
        });

        // --- UTILS ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Jalankan
        init();

    </script>

    <!-- PROTEKSI ZOOM & INSPECT -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) e.preventDefault();
        });
        document.addEventListener('wheel', e => { if(e.ctrlKey) e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard User | WRITEHUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }

        /* --- HEADER --- */
        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-actions button {
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: 0.2s;
        }
        .nav-actions button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* --- MAIN CONTAINER --- */
        main {
            flex: 1;
            max-width: 800px;
            margin: 40px auto;
            width: 100%;
            padding: 0 20px;
        }

        .dashboard-header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .avatar-lg {
            width: 80px;
            height: 80px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
        }
        .user-info h1 { font-size: 1.5rem; margin-bottom: 4px; }
        .user-info p { color: var(--text-muted); }

        /* --- CARDS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 50px;
            height: 50px;
            background: var(--bg-body);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary);
        }
        .stat-info h3 { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .stat-info .value { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }

        /* --- SETTINGS CARD --- */
        .settings-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 24px;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            transition: 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { background: var(--text-muted); cursor: not-allowed; }

        /* --- LOADING STATE --- */
        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- TOAST --- */
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #333; color: white; padding: 12px 20px;
            border-radius: 8px; z-index: 200; opacity: 0;
            transform: translateY(20px); transition: 0.3s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p style="color:var(--text-muted)">Memuat data akun...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Notifikasi</div>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-file-alt"></i> WRITEHUB
            </a>
            <div class="nav-actions">
                <button onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>
        </div>
    </header>

    <main id="dashboardContent" style="display:none;">
        <div class="dashboard-header">
            <div class="avatar-lg" id="userAvatar">U</div>
            <div class="user-info">
                <h1 id="userName">Nama User</h1>
                <p id="userEmail">user@email.com</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
                <div class="stat-info">
                    <h3>Total Order CV</h3>
                    <div class="value" id="orderCount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-wallet"></i></div>
                <div class="stat-info">
                    <h3>Status Akun</h3>
                    <div class="value" style="font-size: 1.2rem; color: var(--success);">Aktif</div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h2 class="section-title">Keamanan Akun</h2>
            <form onsubmit="event.preventDefault(); handleChangePassword();">
                <div class="form-group">
                    <label class="form-label">Password Baru</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="Masukkan password minimal 6 karakter" required minlength="6">
                </div>
                <button type="submit" class="btn-primary" id="btnChangePass">
                    Simpan Perubahan Password
                </button>
            </form>
        </div>
    </main>

    <!-- Jika belum login -->
    <div id="notLoggedIn" style="display:none; text-align:center; padding: 50px;">
        <i class="fas fa-lock" style="font-size:3rem; color:var(--text-muted); margin-bottom:20px;"></i>
        <h2>Akses Ditolak</h2>
        <p style="color:var(--text-muted); margin-bottom:20px;">Anda harus login untuk mengakses halaman ini.</p>
        <a href="index.html" class="btn-primary" style="display:inline-block; width:auto;">Kembali ke Beranda</a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // KONFIGURASI SAMA DENGAN INDEX.HTML
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;

        // --- FUNGSI UTILITAS ---
        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        const setLoading = (loading) => {
            document.getElementById('loadingOverlay').style.display = loading ? 'flex' : 'none';
        };

        // --- 1. HANDLE URL AUTHENTICATION (Deep Link) ---
        async function handleUrlSession() {
            // Cek query param ?auth=... atau ?access_token=...
            const params = new URLSearchParams(window.location.search);
            const authToken = params.get('auth') || params.get('access_token');
            
            // Cek hash fragment #access_token=... (bawaan Supabase)
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const hashToken = hashParams.get('access_token');

            const token = authToken || hashToken;

            if (token) {
                console.log("Token ditemukan di URL, mencoba login...");
                // Biasanya Supabase butuh refresh token juga, tapi untuk URL magic link sederhana:
                // Kita coba ambil session dari hash jika ada, atau set session manual
                const { data, error } = await supabase.auth.setSession({
                    access_token: token
                });
                
                if (!error) {
                    // Bersihkan URL agar token tidak muncul di browser bar demi keamanan
                    window.history.replaceState({}, document.title, "user.html");
                    return data.user;
                }
            }
            return null;
        }

        // --- 2. FETCH USER DATA ---
        async function loadDashboard() {
            setLoading(true);

            // Cek session dari URL dulu
            let user = await handleUrlSession();

            // Jika tidak ada di URL, cek LocalStorage
            if (!user) {
                const { data: { session } } = await supabase.auth.getSession();
                user = session?.user;
            }

            if (!user) {
                // Belum login sama sekali
                setLoading(false);
                document.getElementById('notLoggedIn').style.display = 'block';
                document.getElementById('dashboardContent').style.display = 'none';
                return;
            }

            currentUser = user;
            
            // Tampilkan Dashboard
            document.getElementById('notLoggedIn').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';

            // Ambil detail profil (nama) dari tabel 'profiles'
            // Default: ambil dari email jika profile kosong
            let fullName = user.email.split('@')[0];
            
            try {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('full_name, role')
                    .eq('id', user.id)
                    .single();
                
                if (profile) {
                    fullName = profile.full_name || fullName;
                }
            } catch (e) {
                console.warn("Gagal ambil profile tabel, pakai default");
            }

            // Update UI Text
            document.getElementById('userName').innerText = fullName;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userAvatar').innerText = fullName.charAt(0).toUpperCase();

            // Fetch Jumlah Order
            await fetchOrderCount(user.id);

            setLoading(false);
        }

        // --- 3. FETCH ORDER COUNT ---
        async function fetchOrderCount(userId) {
            try {
                const { count, error } = await supabase
                    .from('orders')
                    .select('*', { count: 'exact', head: true })
                    .eq('user_id', userId);

                if (error) throw error;
                document.getElementById('orderCount').innerText = count || 0;
            } catch (err) {
                console.error("Error fetching orders:", err);
                document.getElementById('orderCount').innerText = "-";
            }
        }

        // --- 4. CHANGE PASSWORD ---
        window.handleChangePassword = async function() {
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('btnChangePass');
            
            if (!newPass) return;

            btn.disabled = true;
            btn.innerText = "Menyimpan...";

            const { data, error } = await supabase.auth.updateUser({
                password: newPass
            });

            if (error) {
                showToast('Gagal ganti password: ' + error.message);
            } else {
                showToast('Password berhasil diubah!');
                document.getElementById('newPassword').value = '';
            }

            btn.disabled = false;
            btn.innerText = "Simpan Perubahan Password";
        }

        // --- 5. LOGOUT ---
        window.handleLogout = async function() {
            await supabase.auth.signOut();
            window.location.href = "index.html";
        }

        // --- INIT ---
        loadDashboard();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Market - Template Profesional</title>
    
    <!-- Font Google -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --primary: #0066cc;
            --primary-dark: #004c99;
            --primary-light: #e6f0fa;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        img { display: block; max-width: 100%; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }
        input, select { font-family: inherit; }

        /* --- UTILITIES --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .hidden { display: none !important; }

        /* --- HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
        }
        
        .logo img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            outline: none;
            transition: 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* --- HERO --- */
        .hero {
            margin: 30px 0;
            padding: 60px 20px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: var(--radius);
            text-align: center;
        }
        .hero h1 { font-size: 2.2rem; margin-bottom: 10px; color: var(--text-main); }
        .hero p { color: var(--text-sub); margin-bottom: 20px; }

        /* --- FILTERS --- */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            outline: none;
        }

        /* --- PRODUCT GRID (SUPER RESPONSIF) --- */
        .product-grid {
            display: grid;
            /* Logika Responsif Cerdas */
            grid-template-columns: repeat(2, 1fr); /* Default Mobile */
            gap: 15px;
            margin-bottom: 60px;
        }

        @media (min-width: 480px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
        }
        @media (min-width: 768px) {
            .product-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; }
        }
        @media (min-width: 1024px) {
            .product-grid { grid-template-columns: repeat(4, 1fr); gap: 30px; }
        }
        @media (min-width: 1280px) {
            .product-grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* --- CARD STYLE --- */
        .cv-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .cv-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .card-img-wrap {
            position: relative;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: #f1f5f9;
            overflow: hidden;
        }

        .card-img-wrap img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .cv-card:hover .card-img-wrap img { transform: scale(1.08); }

        /* BADGE */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        .card-body {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.7rem;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            font-size: 0.85rem;
        }

        .price { color: var(--primary); font-weight: 700; font-size: 1rem; }
        .sold { color: var(--text-sub); font-size: 0.75rem; }

        /* --- MODAL DETAIL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(50px); } to { transform: translateY(0); } }

        .modal-body {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .modal-body { flex-direction: row; }
            .modal-image { width: 50%; height: auto; }
            .modal-details { width: 50%; padding: 30px; }
        }

        .modal-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal-details { padding: 20px; display: flex; flex-direction: column; }
        .modal-badge { 
            display: inline-block; background: var(--primary-light); 
            color: var(--primary); padding: 4px 12px; 
            border-radius: 20px; font-size: 0.8rem; font-weight: 600; width: fit-content; margin-bottom: 10px;
        }
        .modal-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        .modal-price { font-size: 1.25rem; color: var(--primary); font-weight: 700; margin-bottom: 20px; }
        .modal-desc { color: var(--text-sub); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; flex: 1; }
        
        .btn-buy {
            background: #25D366; /* WA Color */
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-buy:hover { background: #128C7E; }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        /* --- POPUP IKLAN --- */
        .ad-popup-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 900;
            max-width: 300px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: none; /* Hidden by default */
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .ad-popup-overlay img { width: 100%; height: auto; display: block; }
        .ad-close-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(0,0,0,0.5);
            color: white;
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* --- FOOTER --- */
        footer { background: white; border-top: 1px solid var(--border); padding: 40px 0; margin-top: 50px; text-align: center; color: var(--text-sub); font-size: 0.9rem; }

    </style>
</head>
<body oncontextmenu="return false;"> <!-- Proteksi Klik Kanan -->

    <!-- Header -->
    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo">
                <!-- LOGO PNG (Placeholder URL Ganti dengan URL PNG Anda) -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="Logo CV Market">
                <span>CV Market</span>
            </a>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari template CV (Contoh: Creative, Manager)...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Hero -->
        <section class="hero">
            <h1>Temukan CV Profesionalmu</h1>
            <p>Ratusan desain siap pakai untuk melamar kerja impian.</p>
        </section>

        <!-- Filter -->
        <div class="filters">
            <select id="catFilter" class="filter-select">
                <option value="all">Semua Kategori</option>
                <option value="Creative">Creative Design</option>
                <option value="Formal">Formal / Korporat</option>
                <option value="Tech">IT & Tech</option>
                <option value="Simple">Minimalis</option>
            </select>
            <select id="sortFilter" class="filter-select">
                <option value="default">Terbaru</option>
                <option value="price_low">Harga Terendah</option>
                <option value="price_high">Harga Tertinggi</option>
            </select>
        </div>

        <!-- Grid Produk -->
        <div class="product-grid" id="productGrid">
            <!-- Loading State -->
            <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
                <p>Memuat produk...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 CV Market. All rights reserved.</p>
        </div>
    </footer>

    <!-- MODAL DETAIL PRODUK -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="m-image" src="" alt="Detail">
                </div>
                <div class="modal-details">
                    <span id="m-category" class="modal-badge">Kategori</span>
                    <h2 id="m-title" class="modal-title">Judul Produk</h2>
                    <div id="m-price" class="modal-price">Rp 0</div>
                    <div style="margin-bottom: 15px; font-size: 0.9rem; color: #666;">
                        <i class="fas fa-shopping-bag"></i> Terjual <span id="m-sold">0</span> kali
                    </div>
                    <p id="m-desc" class="modal-desc">Deskripsi produk...</p>
                    <button id="m-btn-buy" class="btn-buy">
                        <i class="fab fa-whatsapp"></i> Pesan Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP IKLAN (Dinamis) -->
    <div class="ad-popup-overlay" id="adPopup">
        <div class="ad-close-btn" onclick="closeAd()"><i class="fas fa-times"></i></div>
        <a href="#" target="_blank" id="adLink">
            <img id="adImage" src="" alt="Iklan">
        </a>
    </div>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // --- KONFIGURASI ---
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';
        const ADMIN_WA = '6281234567890';

        let supabase;
        let useSupabase = false;

        if (SUPABASE_URL.length > 10 && SUPABASE_ANON_KEY.length > 10) {
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                useSupabase = true;
            } catch(e) { console.log("Supabase init failed"); }
        }

        // --- DATA DUMMY (Menyesuaikan struktur DB: sold_count, description) ---
        const dummyData = [
            { 
                id: 1, 
                title: "CV Creative Pro Designer", 
                category: "Creative", 
                price: 50000, 
                sold_count: 120, 
                description: "Template CV kreatif dengan tata letak unik, cocok untuk desainer grafis dan seniman.",
                image: "https://picsum.photos/seed/cv1/600/600" 
            },
            { 
                id: 2, 
                title: "Corporate Executive Blue", 
                category: "Formal", 
                price: 75000, 
                sold_count: 85, 
                description: "Desain formal dan berwibawa, sangat cocok untuk pelamar posisi manager atau direksi.",
                image: "https://picsum.photos/seed/cv2/600/600" 
            },
            { 
                id: 3, 
                title: "Tech Developer Dark Mode", 
                category: "Tech", 
                price: 90000, 
                sold_count: 200, 
                description: "CV bergaya coding dengan dark mode, menampilkan skill teknis dengan rapi.",
                image: "https://picsum.photos/seed/cv3/600/600" 
            },
            { 
                id: 4, 
                title: "Minimalist Clean Fresh Grad", 
                category: "Simple", 
                price: 35000, 
                sold_count: 500, 
                description: "Simpel, bersih, dan efektif. Pilihan terbaik untuk fresh graduate.",
                image: "https://picsum.photos/seed/cv4/600/600" 
            },
            { 
                id: 5, 
                title: "Bold Marketing Resume", 
                category: "Creative", 
                price: 60000, 
                sold_count: 45, 
                description: "Desain yang berani mencuri perhatian rekruter di bidang marketing.",
                image: "https://picsum.photos/seed/cv5/600/600" 
            },
            { 
                id: 6, 
                title: "Finance & Accounting Formal", 
                category: "Formal", 
                price: 80000, 
                sold_count: 60, 
                description: "Struktur yang sangat teratur, fokus pada pengalaman dan keahlian numerik.",
                image: "https://picsum.photos/seed/cv6/600/600" 
            }
        ];

        let products = [];
        let filteredProducts = [];

        // --- INIT ---
        async function init() {
            await fetchProducts();
            await fetchAd();
            renderProducts();
        }

        // 1. FETCH PRODUK
        async function fetchProducts() {
            if (useSupabase) {
                const { data, error } = await supabase.from('cvs').select('*');
                if (data) products = data;
                else { console.error(error); products = dummyData; }
            } else {
                // Simulasi delay
                await new Promise(r => setTimeout(r, 800));
                products = dummyData;
            }
            filteredProducts = [...products];
        }

        // 2. FETCH IKLAN (Dari tabel 'iklan')
        async function fetchAd() {
            if (!useSupabase) return;
            
            // Asumsi tabel 'iklan' punya kolom: image_url, link_url
            const { data, error } = await supabase.from('iklan').select('*').eq('is_active', true).single();
            
            if (data && data.image_url) {
                const adPopup = document.getElementById('adPopup');
                document.getElementById('adImage').src = data.image_url;
                if(data.link_url) document.getElementById('adLink').href = data.link_url;
                
                // Tampilkan iklan setelah delay sedikit
                setTimeout(() => {
                    adPopup.style.display = 'block';
                }, 2000);
            }
        }

        // 3. RENDER
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 20px;">Produk tidak ditemukan</div>`;
                return;
            }

            filteredProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'cv-card';
                card.onclick = () => openModal(p); // Klik kartu buka modal
                
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <span class="badge">${p.category}</span>
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${p.title}</h3>
                        <div class="card-meta">
                            <div class="price">Rp ${p.price.toLocaleString('id-ID')}</div>
                            <div class="sold">${p.sold_count || 0} Terjual</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. FILTER & SEARCH (Pintar)
        function filterLogic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('catFilter').value;
            const sort = document.getElementById('sortFilter').value;

            filteredProducts = products.filter(p => {
                // Cek Judul DAN Kategori
                const matchText = p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
                const matchCat = cat === 'all' || p.category === cat;
                return matchText && matchCat;
            });

            // Sorting
            if (sort === 'price_low') filteredProducts.sort((a,b) => a.price - b.price);
            if (sort === 'price_high') filteredProducts.sort((a,b) => b.price - a.price);

            renderProducts();
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterLogic);
        document.getElementById('catFilter').addEventListener('change', filterLogic);
        document.getElementById('sortFilter').addEventListener('change', filterLogic);

        // 5. MODAL LOGIC
        window.openModal = function(product) {
            document.getElementById('m-image').src = product.image;
            document.getElementById('m-category').innerText = product.category;
            document.getElementById('m-title').innerText = product.title;
            document.getElementById('m-price').innerText = "Rp " + product.price.toLocaleString('id-ID');
            document.getElementById('m-sold').innerText = product.sold_count || 0;
            document.getElementById('m-desc').innerText = product.description || "Tidak ada deskripsi tersedia.";
            
            // Set tombol beli
            const btn = document.getElementById('m-btn-buy');
            btn.onclick = () => buyViaWA(product.title, product.price);

            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop scroll background
        }

        window.closeModal = function() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Tutup modal jika klik di luar konten
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target.id === 'productModal') closeModal();
        });

        // 6. WHATSAPP LOGIC
        function buyViaWA(title, price) {
            const msg = `Halo Admin, saya ingin membeli template CV: *${title}* seharga Rp ${price.toLocaleString('id-ID')}`;
            const url = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // 7. AD POPUP LOGIC
        window.closeAd = function() {
            document.getElementById('adPopup').style.display = 'none';
        }

        // Jalankan
        init();

    </script>

    <!-- SCRIPT PROTEKSI SOURCE CODE -->
    <script>
        // Mencegah Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Mencegah Inspect Element & Shortcuts
        document.onkeydown = function(e) {
            // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
               (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
            // Mencegah F1 (Biasanya Help, sering digunakan untuk inspect di mode tertentu)
            if(e.keyCode == 112) { 
                // Opsional: Alihkan fokus atau abaikan
                return false; 
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Proteksi Zoom Tetap Aktif -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Market - Profesional Template</title>
    
    <!-- Font Google: Inter (Ketajaman tinggi, sangat clean) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES (Premium & Clean Theme) --- */
        :root {
            /* Warna Utama: Royal Blue yang elegan */
            --primary: #2563eb;       
            --primary-dark: #1e40af;
            --primary-light: #eff6ff;
            
            /* Warna Netral (Slate - Lebih modern dari hitam putih biasa) */
            --bg-body: #f8fafc;       /* Abu sangat muda */
            --bg-card: #ffffff;
            --text-main: #0f172a;     /* Hampir hitam */
            --text-muted: #64748b;    /* Abu-abu teks */
            --border: #e2e8f0;       
            
            /* Efek */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 16px;           /* Sudut membulat modern */
            --transition: all 0.3s ease;
        }

        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden; /* Mencegah scroll horizontal */
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }
        ul { list-style: none; }
        img { display: block; max-width: 100%; }
        button, input, select { font-family: inherit; border: none; outline: none; }

        /* --- UTILITIES --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .hidden { display: none !important; }

        /* --- HEADER (Glassmorphism) --- */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 0;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        
        .logo img {
            height: 32px;
            width: auto;
        }

        /* Search Bar Minimalis */
        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 50px;
            background: var(--bg-body);
            border: 1px solid transparent;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            background: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-actions {
            display: flex;
            gap: 20px;
            color: var(--text-muted);
        }
        .nav-actions i { font-size: 1.2rem; transition: 0.2s; cursor: pointer; }
        .nav-actions i:hover { color: var(--primary); }

        /* --- HERO SLIDER (Clean & Elegant) --- */
        .hero-section {
            margin-top: 30px;
            position: relative;
            width: 100%;
            /* Rasio Lebar tapi tidak terlalu tinggi */
            aspect-ratio: 21 / 9; 
            background: #e2e8f0;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .slider-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* Slider Controls (Minimalis) */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: var(--shadow-sm);
            opacity: 0;
        }
        .hero-section:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        .slider-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 2;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: 0.3s;
        }
        .dot.active { background: white; width: 24px; border-radius: 10px; }

        /* --- FILTER BAR --- */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin: 30px 0;
            overflow-x: auto;
            padding-bottom: 5px;
            /* Hide Scrollbar */
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-chip:hover, .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* --- PRODUCT GRID (Responsive & Clean) --- */
        .product-grid {
            display: grid;
            /* Grid cerdas: 2 kolom di HP, naik seiring layar */
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 60px;
        }

        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        /* --- CARD STYLE (Modern UI) --- */
        .cv-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .cv-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .card-image {
            position: relative;
            padding-top: 100%; /* Square 1:1 */
            background: #f1f5f9;
            overflow: hidden;
        }

        .card-image img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .cv-card:hover .card-image img {
            transform: scale(1.05);
        }

        /* Badge yang halus */
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(4px);
        }

        .card-content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.4;
            height: 2.8rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 12px;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .sold-info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- MODAL (Clean) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
            padding: 20px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white;
            width: 100%; max-width: 900px;
            border-radius: 20px;
            overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-body { display: flex; flex-direction: column; overflow-y: auto; max-height: 90vh; }
        
        @media (min-width: 768px) {
            .modal-body { flex-direction: row; height: 500px; }
            .modal-img { width: 55%; }
            .modal-info { width: 45%; padding: 40px; }
        }
        
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal-info { padding: 24px; display: flex; flex-direction: column; }
        .modal-cat { 
            color: var(--primary); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; 
        }
        .modal-title { font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 16px; line-height: 1.3; }
        .modal-price { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
        .modal-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; flex: 1; overflow-y: auto; margin-bottom: 24px; }
        
        .btn-buy {
            background: var(--primary); color: white; padding: 16px;
            border-radius: 12px; font-weight: 600; font-size: 1rem; text-align: center;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-buy:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        .btn-close {
            position: absolute; top: 20px; right: 20px;
            background: white; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; box-shadow: var(--shadow-md);
            color: var(--text-main); transition: 0.2s;
        }
        .btn-close:hover { background: var(--bg-body); }

        /* --- AD POPUP --- */
        .ad-popup {
            position: fixed; bottom: 24px; left: 24px; z-index: 900;
            width: 280px; background: white; border-radius: 16px;
            box-shadow: var(--shadow-lg); overflow: hidden; display: none;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .ad-img img { width: 100%; display: block; }
        .ad-close {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.5); color: white; width: 24px; height: 24px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem;
        }

        /* Footer */
        footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 0.9rem; background: white; }

    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Header -->
    <header>
        <div class="container nav-wrapper">
            <a href="#" class="logo">
                <!-- Ganti URL ini dengan Logo PNG Anda -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="Logo">
                <span>CV Market</span>
            </a>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari template (contoh: Minimalis, IT)...">
            </div>

            <div class="nav-actions">
                <i class="far fa-heart"></i>
                <i class="fas fa-shopping-bag"></i>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Hero Slider -->
        <section class="hero-section" id="heroSlider">
            <div class="slider-container" id="sliderTrack"></div>
            <button class="slider-btn prev-btn" onclick="window.prevSlide()"><i class="fas fa-chevron-left"></i></button>
            <button class="slider-btn next-btn" onclick="window.nextSlide()"><i class="fas fa-chevron-right"></i></button>
            <div class="slider-dots" id="sliderDots"></div>
        </section>

        <!-- Filter Bar (Chips) -->
        <div class="filter-bar">
            <div class="filter-chip active" onclick="setCategory('all', this)">Semua</div>
            <div class="filter-chip" onclick="setCategory('Creative', this)">Creative</div>
            <div class="filter-chip" onclick="setCategory('Formal', this)">Formal</div>
            <div class="filter-chip" onclick="setCategory('Tech', this)">Tech</div>
            <div class="filter-chip" onclick="setCategory('Simple', this)">Minimalis</div>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
                <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 CV Market. Profesional Template Solutions.</p>
        </div>
    </footer>

    <!-- MODAL DETAIL -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="btn-close" onclick="closeModal()"><i class="fas fa-times"></i></div>
            <div class="modal-body">
                <div class="modal-img">
                    <img id="m-image" src="" alt="">
                </div>
                <div class="modal-info">
                    <div id="m-cat" class="modal-cat">CATEGORY</div>
                    <h2 id="m-title" class="modal-title">Product Title</h2>
                    <div id="m-price" class="modal-price">Rp 0</div>
                    <p id="m-desc" class="modal-desc">Description here...</p>
                    
                    <div style="margin-bottom: 20px; font-size: 0.9rem; color: var(--text-muted);">
                        <i class="fas fa-check-circle" style="color:var(--primary)"></i> Terjual <span id="m-sold">0</span> kali
                    </div>

                    <button id="m-btn-buy" class="btn-buy">
                        <i class="fab fa-whatsapp"></i> Beli Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP IKLAN -->
    <div class="ad-popup" id="adPopup">
        <div class="ad-close" onclick="closeAd()"><i class="fas fa-times"></i></div>
        <a href="#" target="_blank" id="adLink">
            <div class="ad-img">
                <img id="adImage" src="" alt="Ad">
            </div>
        </a>
    </div>

    <!-- JAVASCRIPT -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // --- KONFIGURASI ---
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';
        const ADMIN_WA = '6281234567890';

        let supabase;
        let useSupabase = false;

        if (SUPABASE_URL.length > 10 && SUPABASE_ANON_KEY.length > 10) {
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                useSupabase = true;
            } catch(e) {}
        }

        // --- DATA SLIDER (Ganti dengan PNG Banner Anda) ---
        const sliderData = [
            { image: 'https://picsum.photos/seed/modern1/1200/500', link: '#' },
            { image: 'https://picsum.photos/seed/modern2/1200/500', link: '#' },
            { image: 'https://picsum.photos/seed/modern3/1200/500', link: '#' }
        ];

        // --- DATA DUMMY ---
        const dummyData = [
            { id: 1, title: "Modern Creative Portfolio", category: "Creative", price: 50000, sold_count: 120, description: "Template dengan layout asimetris yang modern, cocok untuk industri kreatif.", image: "https://picsum.photos/seed/clean1/600/600" },
            { id: 2, title: "Executive Formal Blue", category: "Formal", price: 75000, sold_count: 85, description: "Struktur profesional untuk level manajerial dengan warna biru tenang.", image: "https://picsum.photos/seed/clean2/600/600" },
            { id: 3, title: "Developer Dark Mode", category: "Tech", price: 90000, sold_count: 200, description: "Tema gelap elegan untuk programmer, menyorot skill teknis.", image: "https://picsum.photos/seed/clean3/600/600" },
            { id: 4, title: "Clean Minimalist", category: "Simple", price: 35000, sold_count: 500, description: "Fokus pada konten tanpa gangguan visual. Terbaik untuk fresh graduate.", image: "https://picsum.photos/seed/clean4/600/600" },
            { id: 5, title: "Bold Marketing Kit", category: "Creative", price: 60000, sold_count: 45, description: "Desain berani untuk menarik perhatian HRD di bidang marketing.", image: "https://picsum.photos/seed/clean5/600/600" },
            { id: 6, title: "Finance Structure", category: "Formal", price: 80000, sold_count: 60, description: "Rapi, terstruktur, dan menonjolkan kuantifikasi prestasi.", image: "https://picsum.photos/seed/clean6/600/600" }
        ];

        let products = [];
        let filteredProducts = [];
        let currentCategory = 'all';

        // --- INIT ---
        async function init() {
            initSlider();
            await fetchProducts();
            await fetchAd();
            renderProducts();
        }

        // --- SLIDER LOGIC ---
        let slideIndex = 0;
        let slideInterval;

        function initSlider() {
            const track = document.getElementById('sliderTrack');
            const dots = document.getElementById('sliderDots');
            
            sliderData.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i===0?'active':''}`;
                div.innerHTML = `<a href="${s.link}"><img src="${s.image}" loading="lazy"></a>`;
                track.appendChild(div);

                const dot = document.createElement('div');
                dot.className = `dot ${i===0?'active':''}`;
                dot.onclick = () => goToSlide(i);
                dots.appendChild(dot);
            });
            
            startSlide();
            document.getElementById('heroSlider').addEventListener('mouseenter', stopSlide);
            document.getElementById('heroSlider').addEventListener('mouseleave', startSlide);
        }

        function goToSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[n].classList.add('active');
            dots[n].classList.add('active');
            slideIndex = n;
        }

        function nextSlide() { goToSlide((slideIndex + 1) % sliderData.length); }
        function prevSlide() { goToSlide((slideIndex - 1 + sliderData.length) % sliderData.length); }
        
        function startSlide() { slideInterval = setInterval(nextSlide, 5000); }
        function stopSlide() { clearInterval(slideInterval); }
        
        window.nextSlide = nextSlide;
        window.prevSlide = prevSlide;

        // --- DATA & FETCH ---
        async function fetchProducts() {
            if (useSupabase) {
                const { data, error } = await supabase.from('cvs').select('*');
                if (data) products = data;
                else products = dummyData;
            } else {
                await new Promise(r => setTimeout(r, 600));
                products = dummyData;
            }
            filterLogic();
        }

        async function fetchAd() {
            if (!useSupabase) return;
            const { data } = await supabase.from('iklan').select('*').eq('is_active', true).single();
            if (data && data.image_url) {
                document.getElementById('adImage').src = data.image_url;
                document.getElementById('adLink').href = data.link_url || '#';
                setTimeout(() => document.getElementById('adPopup').style.display = 'block', 2000);
            }
        }

        // --- RENDER ---
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(filteredProducts.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;">Produk tidak ditemukan</p>';
                return;
            }

            filteredProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'cv-card';
                card.onclick = () => openModal(p);
                card.innerHTML = `
                    <div class="card-image">
                        <span class="badge">${p.category}</span>
                        <img src="${p.image}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${p.title}</h3>
                        <div class="card-footer">
                            <div class="price">Rp ${p.price.toLocaleString('id-ID')}</div>
                            <div class="sold-info">${p.sold_count || 0} Terjual</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FILTER LOGIC ---
        window.setCategory = function(cat, el) {
            currentCategory = cat;
            // Update Chip UI
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterLogic();
        }

        function filterLogic() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            
            filteredProducts = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchText = p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
                return matchCat && matchText;
            });
            renderProducts();
        }

        document.getElementById('searchInput').addEventListener('input', filterLogic);

        // --- MODAL ---
        window.openModal = function(p) {
            document.getElementById('m-image').src = p.image;
            document.getElementById('m-cat').innerText = p.category;
            document.getElementById('m-title').innerText = p.title;
            document.getElementById('m-price').innerText = "Rp " + p.price.toLocaleString('id-ID');
            document.getElementById('m-desc').innerText = p.description || "";
            document.getElementById('m-sold').innerText = p.sold_count || 0;
            
            document.getElementById('m-btn-buy').onclick = () => {
                const msg = `Halo, saya ingin membeli template CV: *${p.title}*`;
                window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`, '_blank');
            };

            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('productModal').addEventListener('click', (e) => {
            if(e.target.id === 'productModal') closeModal();
        });

        window.closeAd = function() {
            document.getElementById('adPopup').style.display = 'none';
        }

        init();
    </script>

    <!-- PROTEKSI ZOOM & INSPECT -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
               (e.ctrlKey && e.keyCode == 85)) return false;
        };
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) {
                e.preventDefault();
            }
        });
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>

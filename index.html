<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Proteksi Zoom Tetap Aktif -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WRITEHUB - INDONESIA</title>
    
    <!-- Font Google: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --primary: #2563eb;       
            --primary-dark: #1e40af;
            --primary-light: #eff6ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;       
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: var(--transition); }
        img { display: block; max-width: 100%; }
        button, input { font-family: inherit; border: none; outline: none; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        /* --- HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 0;
        }

        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            white-space: nowrap;
        }
        .logo img { height: 28px; width: auto; }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 36px;
            border-radius: 50px;
            background: var(--bg-body);
            border: 1px solid transparent;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .search-box input:focus {
            background: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* --- HERO SLIDER --- */
        .hero-section {
            margin-top: 20px;
            position: relative;
            width: 100%;
            aspect-ratio: 21 / 9; 
            background: #e2e8f0;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        .slider-container { width: 100%; height: 100%; position: relative; }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .slide.active { opacity: 1; z-index: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8); color: var(--text-main);
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 2;
            cursor: pointer; transition: 0.2s; opacity: 0;
        }
        .hero-section:hover .slider-btn { opacity: 1; }
        .slider-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .slider-dots {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 2;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; }
        .dot.active { background: white; width: 20px; border-radius: 10px; }

        /* --- FILTER BAR --- */
        .filter-bar {
            display: flex; gap: 10px; margin: 24px 0;
            overflow-x: auto; padding-bottom: 4px;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px; background: white; border: 1px solid var(--border);
            border-radius: 50px; font-size: 0.85rem; color: var(--text-muted);
            white-space: nowrap; cursor: pointer; transition: var(--transition);
        }
        .filter-chip:hover, .filter-chip.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        /* --- PRODUCT GRID --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 60px;
        }

        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        /* --- CARD STYLE --- */
        .cv-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .cv-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-light);
        }

        .card-image {
            position: relative;
            padding-top: 100%;
            background: #f1f5f9;
            overflow: hidden;
        }

        .card-image img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;
        }
        .cv-card:hover .card-image img { transform: scale(1.05); }

        .badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.95); color: var(--text-main);
            padding: 4px 8px; border-radius: 4px; font-size: 0.65rem;
            font-weight: 600; box-shadow: var(--shadow-sm); z-index: 2;
            text-transform: uppercase;
        }

        .card-content {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.4;
            height: 2.5rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* --- CARD FOOTER (PRICING) --- */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
        }

        .price-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .price-original {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 500;
            margin-bottom: 2px;
            white-space: nowrap;
        }

        .price-main {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.1;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .card-title { font-size: 1rem; height: 2.8rem; }
            .price-original { font-size: 0.8rem; }
            .price-main { font-size: 1.2rem; }
        }

        .sold-info {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            white-space: nowrap;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: white; width: 100%; max-width: 900px; border-radius: 20px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: var(--shadow-lg); transform: scale(0.95); transition: 0.3s; position: relative;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-body { display: flex; flex-direction: column; overflow-y: auto; max-height: 90vh; }
        
        @media (min-width: 768px) {
            .modal-body { flex-direction: row; height: 500px; }
            .modal-img { width: 55%; }
            .modal-info { width: 45%; padding: 40px; }
        }
        
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .modal-info { padding: 24px; display: flex; flex-direction: column; }
        .modal-cat { color: var(--primary); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .modal-title { font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin-bottom: 16px; line-height: 1.3; }
        
        .modal-price-wrap {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 20px;
        }
        .modal-price-original {
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: line-through;
            font-weight: 500;
        }
        .modal-price-final {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .modal-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; flex: 1; overflow-y: auto; margin-bottom: 24px; }
        
        .btn-buy {
            background: var(--primary); color: white; padding: 16px;
            border-radius: 12px; font-weight: 600; font-size: 1rem; text-align: center;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .btn-buy:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        .btn-close {
            position: absolute; top: 20px; right: 20px;
            background: white; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; box-shadow: var(--shadow-md);
            color: var(--text-main); transition: 0.2s;
        }
        .btn-close:hover { background: var(--bg-body); }

        /* --- AD POPUP --- */
        .ad-popup {
            position: fixed; bottom: 20px; left: 20px; z-index: 900;
            width: 260px; background: white; border-radius: 16px;
            box-shadow: var(--shadow-lg); overflow: hidden; display: none;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .ad-img img { width: 100%; display: block; }
        .ad-close {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.5); color: white; width: 24px; height: 24px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem;
        }

        footer { border-top: 1px solid var(--border); padding: 30px 0; margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 0.85rem; background: white; }

    </style>
</head>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // --- KONFIGURASI ---
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';
        
        // Nomor admin default (fallback)
        const DEFAULT_ADMIN_WA = '6285885850204';

        let supabase;
        let useSupabase = false;

        if (SUPABASE_URL.length > 10 && SUPABASE_ANON_KEY.length > 10) {
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                useSupabase = true;
            } catch(e) {}
        }

        // --- DATA SLIDER ---
        const sliderData = [
            { image: 'https://picsum.photos/seed/modern1/1200/500', link: '#' },
            { image: 'https://picsum.photos/seed/modern2/1200/500', link: '#' },
            { image: 'https://picsum.photos/seed/modern3/1200/500', link: '#' }
        ];

        // --- DATA DUMMY (Standar Inggris) ---
        const dummyData = [
            { id: 1, title: "Modern Creative Portfolio", category: "Creative", price: 50000, original_price: 75000, sold_count: 120, description: "Template dengan layout asimetris yang modern.", image: "https://picsum.photos/seed/clean1/600/600" },
            { id: 2, title: "Executive Formal Blue", category: "Formal", price: 75000, original_price: null, sold_count: 85, description: "Struktur profesional untuk level manajerial.", image: "https://picsum.photos/seed/clean2/600/600" },
            { id: 3, title: "Developer Dark Mode", category: "Tech", price: 90000, original_price: 120000, sold_count: 200, description: "Tema gelap elegan untuk programmer.", image: "https://picsum.photos/seed/clean3/600/600" },
            { id: 4, title: "Clean Minimalist", category: "Simple", price: 35000, original_price: null, sold_count: 500, description: "Fokus pada konten tanpa gangguan visual.", image: "https://picsum.photos/seed/clean4/600/600" }
        ];

        let products = [];

        // Mapping Field (Otomatis disesuaikan nanti)
        let fields = {
            title: 'title',
            price: 'price',
            original_price: 'original_price',
            image: 'image',
            category: 'category',
            description: 'description',
            sold_count: 'sold_count'
        };

        // Variabel untuk menyimpan daftar nomor admin dari database
        let adminNumbersList = [];

        // --- HELPER: Format Rupiah ---
        const formatRupiah = (num) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
        }

        // --- FUNGSI AUTO MAP COLUMNS ---
        function autoMapColumns(sampleData) {
            if (!sampleData) return;
            const keys = Object.keys(sampleData);
            
            // Mapping manual untuk kemungkinan nama kolom umum di DB Indonesia
            const map = {
                title: keys.find(k => k.toLowerCase().includes('nama') || k.toLowerCase().includes('title')) || 'title',
                price: keys.find(k => k.toLowerCase().includes('harga') || k.toLowerCase().includes('price')) || 'price',
                original_price: keys.find(k => k.toLowerCase().includes('original') || k.toLowerCase().includes('coret') || k.toLowerCase().includes('asli')) || 'original_price',
                image: keys.find(k => k.toLowerCase().includes('gambar') || k.toLowerCase().includes('image') || k.toLowerCase().includes('url')) || 'image',
                category: keys.find(k => k.toLowerCase().includes('kategori') || k.toLowerCase().includes('category')) || 'category',
                description: keys.find(k => k.toLowerCase().includes('deskripsi') || k.toLowerCase().includes('desc')) || 'description',
                sold_count: keys.find(k => k.toLowerCase().includes('terjual') || k.toLowerCase().includes('sold')) || 'sold_count'
            };

            console.log("Mapping Kolom Database:", map);
            fields = map;
        }

        // --- FUNGSI AMBIL NOMOR ADMIN ---
        async function fetchAdminNumbers() {
            if (useSupabase) {
                const { data, error } = await supabase.from('no_wa').select('nomor');
                if (data && data.length > 0) {
                    adminNumbersList = data.map(item => item.nomor).filter(n => n);
                    console.log("Admin WA Numbers loaded:", adminNumbersList);
                } else {
                    console.warn("Gagal mengambil nomor WA atau tabel kosong.");
                }
            }
            
            if (adminNumbersList.length === 0) {
                adminNumbersList = [DEFAULT_ADMIN_WA];
            }
        }

        // --- FUNGSI ROTASI ADMIN ---
        function getRotatedAdminNumber() {
            let currentIndex = parseInt(localStorage.getItem('wa_admin_index') || '0');
            const selectedNumber = adminNumbersList[currentIndex];
            let nextIndex = (currentIndex + 1) % adminNumbersList.length;
            localStorage.setItem('wa_admin_index', nextIndex.toString());
            return selectedNumber;
        }

        // --- HELPER: AMBIL VALUE SECARA AMAN ---
        function getField(item, fieldKey) {
            const key = fields[fieldKey];
            // Cek key mapping, jika tidak ada coba key default
            return item[key] || item[fieldKey];
        }

        // --- INIT ---
        async function init() {
            initSlider();
            await fetchAdminNumbers(); 
            await fetchProducts();
            await fetchAd();
            renderProducts();
        }

        // --- SLIDER LOGIC ---
        let slideIndex = 0;
        let slideInterval;

        function initSlider() {
            const track = document.getElementById('sliderTrack');
            const dots = document.getElementById('sliderDots');
            
            sliderData.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i===0?'active':''}`;
                div.innerHTML = `<a href="${s.link}"><img src="${s.image}" loading="lazy"></a>`;
                track.appendChild(div);

                const dot = document.createElement('div');
                dot.className = `dot ${i===0?'active':''}`;
                dot.onclick = () => goToSlide(i);
                dots.appendChild(dot);
            });
            
            startSlide();
            document.getElementById('heroSlider').addEventListener('mouseenter', stopSlide);
            document.getElementById('heroSlider').addEventListener('mouseleave', startSlide);
        }

        function goToSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[n].classList.add('active');
            dots[n].classList.add('active');
            slideIndex = n;
        }

        function nextSlide() { goToSlide((slideIndex + 1) % sliderData.length); }
        function prevSlide() { goToSlide((slideIndex - 1 + sliderData.length) % sliderData.length); }
        
        function startSlide() { slideInterval = setInterval(nextSlide, 5000); }
        function stopSlide() { clearInterval(slideInterval); }
        
        window.nextSlide = nextSlide;
        window.prevSlide = prevSlide;

        // --- DATA & FETCH ---
        async function fetchProducts() {
            if (useSupabase) {
                // Coba ambil satu data dulu untuk mapping kolom
                const { data: sample, error: sampleErr } = await supabase.from('cvs').select('*').limit(1);
                
                if (!sampleErr && sample && sample.length > 0) {
                    // Lakukan Auto-Map berdasarkan kolom yang terdeteksi
                    autoMapColumns(sample[0]);
                    
                    // Ambil semua data setelah mapping diketahui
                    const { data, error } = await supabase.from('cvs').select('*');
                    if (data) products = data;
                    else products = dummyData;
                } else {
                    console.warn("Gagal koneksi DB, menggunakan Dummy Data.");
                    products = dummyData;
                }
            } else {
                await new Promise(r => setTimeout(r, 800));
                products = dummyData;
            }
            filterLogic();
        }

        async function fetchAd() {
            if (!useSupabase) return;
            const { data } = await supabase.from('iklan').select('*').eq('is_active', true).single();
            if (data && data.image_url) {
                document.getElementById('adImage').src = data.image_url;
                document.getElementById('adLink').href = data.link_url || '#';
                setTimeout(() => document.getElementById('adPopup').style.display = 'block', 2000);
            }
        }

        // --- RENDER ---
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(filteredProducts.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:20px;">CV tidak ditemukan</p>';
                return;
            }

            filteredProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'cv-card';
                card.onclick = () => openModal(p);
                
                // Menggunakan getField agar kompatibel DB/Dummy
                const title = getField(p, 'title');
                const price = getField(p, 'price');
                const originalPrice = getField(p, 'original_price');
                const category = getField(p, 'category');
                const image = getField(p, 'image');
                const soldCount = getField(p, 'sold_count');

                let priceHTML = '';
                if (originalPrice && Number(originalPrice) > Number(price)) {
                    priceHTML = `
                        <div class="price-original">${formatRupiah(originalPrice)}</div>
                        <div class="price-main">${formatRupiah(price)}</div>
                    `;
                } else {
                    priceHTML = `<div class="price-main">${formatRupiah(price)}</div>`;
                }

                // Fallback image jika kosong
                const displayImage = image || 'https://picsum.photos/seed/fallback/600/600';

                card.innerHTML = `
                    <div class="card-image">
                        <span class="badge">${category || 'Produk'}</span>
                        <img src="${displayImage}" loading="lazy" alt="${title}">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${title || 'Tanpa Judul'}</h3>
                        <div class="card-footer">
                            <div class="price-container">
                                ${priceHTML}
                            </div>
                            <div class="sold-info">${soldCount || 0} Terpakai</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FILTER LOGIC ---
        window.setCategory = function(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            filterLogic();
        }

        function filterLogic() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            
            filteredProducts = products.filter(p => {
                const title = (getField(p, 'title') || '').toLowerCase();
                const category = (getField(p, 'category') || '').toLowerCase();
                
                const matchCat = currentCategory === 'all' || category.includes(currentCategory.toLowerCase());
                const matchText = title.includes(q) || category.includes(q);
                return matchCat && matchText;
            });
            renderProducts();
        }

        document.getElementById('searchInput').addEventListener('input', filterLogic);

        // --- MODAL ---
        window.openModal = function(p) {
            const title = getField(p, 'title');
            const category = getField(p, 'category');
            const price = getField(p, 'price');
            const originalPrice = getField(p, 'original_price');
            const description = getField(p, 'description');
            const image = getField(p, 'image');
            const soldCount = getField(p, 'sold_count');

            document.getElementById('m-image').src = image || 'https://picsum.photos/seed/modal/800/600';
            document.getElementById('m-cat').innerText = category || 'CATEGORY';
            document.getElementById('m-title').innerText = title || 'Product Title';
            document.getElementById('m-desc').innerText = description || "Deskripsi tidak tersedia.";
            document.getElementById('m-sold').innerText = soldCount || 0;
            
            const priceWrap = document.getElementById('m-price-wrap');
            if (originalPrice && Number(originalPrice) > Number(price)) {
                priceWrap.innerHTML = `
                    <div class="modal-price-original">${formatRupiah(originalPrice)}</div>
                    <div class="modal-price-final">${formatRupiah(price)}</div>
                `;
            } else {
                priceWrap.innerHTML = `<div class="modal-price-final">${formatRupiah(price)}</div>`;
            }

            // --- LOGIKA TOMBOL BELI ---
            document.getElementById('m-btn-buy').onclick = () => {
                const adminNumber = getRotatedAdminNumber();
                
                const templateName = title;
                const formattedPrice = formatRupiah(price);
                
                const orderTime = new Date().toLocaleString('id-ID', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const message = `Halo Admin, saya ingin membeli template CV berikut:

*Nama Template:* ${templateName}
*Harga:* ${formattedPrice}
*Waktu Pesanan:* ${orderTime}

Mohon info pembayaran selanjutnya. Terima kasih.`;

                const waLink = `https://wa.me/${adminNumber}?text=${encodeURIComponent(message)}`;
                window.open(waLink, '_blank');
            };

            document.getElementById('productModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            document.getElementById('productModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('productModal').addEventListener('click', (e) => {
            if(e.target.id === 'productModal') closeModal();
        });

        window.closeAd = function() {
            document.getElementById('adPopup').style.display = 'none';
        }

        init();
    </script>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
               (e.ctrlKey && e.keyCode == 85)) return false;
        };
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '0')) {
                e.preventDefault();
            }
        });
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>

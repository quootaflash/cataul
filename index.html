<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog CV | WriteHub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#221E82' }}}} 
    </script>

    <style>
        .card-hover:hover { transform: translateY(-12px); box-shadow: 0 25px 50px -12px rgb(34 30 130 / 0.2); }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="fixed top-0 w-full bg-white shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjzgVAIKgZMS9W7eJKCaRyaFnoDviThQstfeD9l9mcwPxUDoovGo7xB3RQByxTXo15fGX0DIeTMxOWkVovnB4FC35iJN6ArGLOlBRI9U4d4gJ7VOTOp-Ki47RIaViiIs12QGjxRmGs2cQzCFniRpBE0GyNLW3s_03rvTcpPeHAruMaUdrIKNX8jaFZ1TcBw/s3264/28063.png" alt="Logo" class="h-12">
                <span class="text-2xl font-bold text-brand">WriteHub</span>
            </div>
        </div>
    </nav>

    <section class="pt-28 pb-12 px-6 max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-10">Katalog Paket CV</h1>

        <div id="status" class="text-center mb-8"></div>
        <div id="loading" class="hidden py-12 text-center">
            <div class="inline-block w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-3 text-gray-500">Menghubungkan ke database...</p>
        </div>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <script>
        // ============== GANTI DENGAN DATA ANDA ==============
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co/rest/v1/';   // ← GANTI
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';                        // ← GANTI FULL KEY

        let allProducts = [];

        async function fetchProducts() {
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            loading.classList.remove('hidden');

            try {
                if (!SUPABASE_URL.includes('.supabase.co')) {
                    throw new Error("SUPABASE_URL belum diisi dengan benar");
                }

                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data, error } = await supabase
                    .from('products')           // pastikan nama tabel benar
                    .select('*');

                loading.classList.add('hidden');

                if (error) {
                    console.error("Supabase Error:", error);
                    throw error;
                }

                if (data && data.length > 0) {
                    allProducts = data;
                    status.innerHTML = `<span class="bg-green-100 text-green-700 px-5 py-2 rounded-2xl text-sm">✅ Berhasil memuat ${data.length} produk</span>`;
                    renderProducts(data);
                } else {
                    status.innerHTML = `<span class="bg-yellow-100 text-yellow-700 px-5 py-2 rounded-2xl text-sm">⚠️ Database kosong, menggunakan data contoh</span>`;
                    loadDummyData();
                }

            } catch (err) {
                loading.classList.add('hidden');
                console.error("Full Error:", err);

                let errorMsg = "Gagal mengambil data dari Supabase";

                if (err.message.includes("Failed to fetch")) {
                    errorMsg = "❌ Koneksi gagal - Periksa URL Supabase";
                } else if (err.code === 'PGRST301') {
                    errorMsg = "❌ Tabel 'products' tidak ditemukan";
                } else if (err.message.includes("JWT")) {
                    errorMsg = "❌ Anon Key salah atau expired";
                }

                status.innerHTML = `
                    <div class="bg-red-100 text-red-700 p-5 rounded-3xl max-w-md mx-auto text-left">
                        <strong>${errorMsg}</strong><br>
                        <small class="block mt-2">${err.message}</small>
                    </div>`;
                
                loadDummyData();
            }
        }

        function loadDummyData() {
            allProducts = [
                { name: "CV Fresh Graduate", category: "fresher", price: "Rp 99.000", description: "Desain modern & ATS Friendly", image_url: "https://images.unsplash.com/photo-1586281380349-632531db7ed4", tag: "Best Seller" },
                { name: "CV Professional", category: "experienced", price: "Rp 199.000", description: "Untuk kandidat berpengalaman", image_url: "https://images.unsplash.com/photo-1611162617474-5b21e879e113", tag: "Rekomendasi" },
                { name: "CV Executive", category: "experienced", price: "Rp 350.000", description: "Level Manager & Director", image_url: "https://images.unsplash.com/photo-1552664730-d307ca884978" },
            ];
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const waLink = `https://wa.me/6288219673570?text=Halo,%20saya%20mau%20pesan%20${encodeURIComponent(product.name)}`;
                
                grid.innerHTML += `
                    <div class="card-hover bg-white rounded-3xl overflow-hidden border border-gray-100">
                        <img src="${product.image_url || 'https://via.placeholder.com/600x400'}" class="w-full h-52 object-cover">
                        <div class="p-6">
                            <h3 class="font-bold text-xl">${product.name}</h3>
                            <p class="text-2xl font-bold text-brand my-3">${product.price}</p>
                            <p class="text-gray-600 text-sm line-clamp-3">${product.description}</p>
                            <a href="${waLink}" target="_blank" 
                               class="mt-6 block text-center bg-green-500 hover:bg-green-600 text-white font-semibold py-4 rounded-2xl">
                                Pesan via WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // Jalankan
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init();
            fetchProducts();
        });
    </script>
</body>
</html>

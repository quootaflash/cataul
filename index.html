<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog CV Premium | WriteHub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            content: [],
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#221E82', dark: '#1a174e', light: '#3833a0' }
                    }
                }
            }
        }
    </script>

    <style>
        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgb(34 30 130 / 0.15);
        }
        .hero-bg {
            background: linear-gradient(135deg, #221E82 0%, #3833a0 100%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #221E82; border-radius: 20px; }
    </style>
</head>
<body class="font-sans bg-gray-50 text-gray-800">

    <!-- NAVBAR -->
    <nav class="fixed top-0 w-full bg-white/95 backdrop-blur-lg border-b z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjzgVAIKgZMS9W7eJKCaRyaFnoDviThQstfeD9l9mcwPxUDoovGo7xB3RQByxTXo15fGX0DIeTMxOWkVovnB4FC35iJN6ArGLOlBRI9U4d4gJ7VOTOp-Ki47RIaViiIs12QGjxRmGs2cQzCFniRpBE0GyNLW3s_03rvTcpPeHAruMaUdrIKNX8jaFZ1TcBw/s3264/28063.png" 
                     alt="WriteHub" class="h-12 w-auto">
                <span class="font-bold text-2xl tracking-tight text-brand">WriteHub</span>
            </div>
            <a href="https://wa.me/6288219673570" target="_blank"
               class="flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-2xl font-semibold transition">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                <span>Hubungi Admin</span>
            </a>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero-bg text-white pt-32 pb-20">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <span class="inline-block px-5 py-2 bg-white/20 backdrop-blur-md rounded-full text-sm font-medium mb-6" data-aos="fade-down">
                CV Profesional • ATS Friendly
            </span>
            <h1 class="text-5xl md:text-6xl font-bold leading-tight mb-6" data-aos="fade-up">
                Buat CV yang <span class="text-yellow-300">Membuat HR Terkesan</span>
            </h1>
            <p class="text-xl text-white/80 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100">
                Pilih paket CV terbaik dan dapatkan kesempatan interview lebih banyak.
            </p>
        </div>
    </section>

    <!-- CATALOG SECTION -->
    <section class="max-w-7xl mx-auto px-6 py-16">
        <!-- Filter -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" data-aos="fade-up">
            <button onclick="filterProducts('all')" class="filter-btn active px-8 py-3 rounded-3xl font-semibold transition-all" data-filter="all">Semua Paket</button>
            <button onclick="filterProducts('fresher')" class="filter-btn px-8 py-3 rounded-3xl font-semibold transition-all" data-filter="fresher">Fresh Graduate</button>
            <button onclick="filterProducts('experienced')" class="filter-btn px-8 py-3 rounded-3xl font-semibold transition-all" data-filter="experienced">Experienced</button>
            <button onclick="filterProducts('package')" class="filter-btn px-8 py-3 rounded-3xl font-semibold transition-all" data-filter="package">Paket Bundling</button>
        </div>

        <!-- Status -->
        <div id="status" class="text-center mb-8"></div>

        <!-- Loading -->
        <div id="loading" class="hidden py-20 flex flex-col items-center justify-center gap-4">
            <div class="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-500">Memuat katalog produk...</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">Tidak ada produk ditemukan di kategori ini.</p>
        </div>
    </section>

    <!-- Floating Button -->
    <a href="https://wa.me/6288219673570" target="_blank"
       class="fixed bottom-8 right-8 bg-green-500 text-white w-16 h-16 rounded-3xl flex items-center justify-center text-4xl shadow-2xl hover:scale-110 transition z-50">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <script>
        // ================== KONFIGURASI ==================
        const SUPABASE_URL = 'https://neuylewfsxcuhayegygf.supabase.co/rest/v1/';     // GANTI
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ldXlsZXdmc3hjdWhheWVneWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTMzNzYsImV4cCI6MjA5NDkyOTM3Nn0.Ra0qI5A87XxODy7v9HIJ-zxqVbO39GwXbJlV8n4ZeIc';               // GANTI
        const ADMIN_WA = '6288219673570';

        let supabaseClient = null;
        let allProducts = [];

        // ================== INIT ==================
        function initSupabase() {
            if (!SUPABASE_URL || SUPABASE_URL.includes('MASUKKAN')) {
                showStatus('Mode Demo - Database belum terhubung', 'yellow');
                loadDummyData();
                return;
            }

            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                showStatus('Terhubung ke Database', 'green');
                fetchProducts();
            } catch (e) {
                console.error(e);
                showStatus('Gagal koneksi ke database', 'red');
                loadDummyData();
            }
        }

        async function fetchProducts() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('product-grid').innerHTML = '';

            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('price', { ascending: true });

                document.getElementById('loading').classList.add('hidden');

                if (error) throw error;

                if (data && data.length > 0) {
                    allProducts = data;
                    renderProducts(data);
                } else {
                    loadDummyData();
                }
            } catch (err) {
                console.error(err);
                showStatus('Gagal mengambil data dari Supabase', 'red');
                loadDummyData();
            }
        }

        function loadDummyData() {
            document.getElementById('loading').classList.add('hidden');
            allProducts = [
                {
                    id: 1, name: "CV Fresh Graduate", category: "fresher",
                    price: "Rp 99.000", description: "Desain modern, ATS friendly, cocok untuk fresh graduate & magang.",
                    image_url: "https://images.unsplash.com/photo-1586281380349-632531db7ed4", tag: "Paling Populer"
                },
                {
                    id: 2, name: "CV Professional", category: "experienced",
                    price: "Rp 199.000", description: "Highlight pengalaman kerja + achievement dengan bahasa yang kuat.",
                    image_url: "https://images.unsplash.com/photo-1611162617474-5b21e879e113", tag: "Rekomendasi"
                },
                {
                    id: 3, name: "CV Executive", category: "experienced",
                    price: "Rp 350.000", description: "Untuk level Manager hingga Director. Sangat premium.",
                    image_url: "https://images.unsplash.com/photo-1552664730-d307ca884978", tag: "Premium"
                },
                {
                    id: 4, name: "Paket CV + LinkedIn", category: "package",
                    price: "Rp 299.000", description: "CV baru + Optimasi LinkedIn agar mudah ditemukan recruiter.",
                    image_url: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3", tag: "Best Value"
                }
            ];
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (products.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            products.forEach((product, index) => {
                const waText = `Halo Admin, saya ingin pesan *${product.name}* (${product.price}).`;
                const waLink = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(waText)}`;

                const html = `
                    <div class="card-hover bg-white rounded-3xl overflow-hidden border border-gray-100 group" data-aos="fade-up" data-aos-delay="${index * 100}">
                        <div class="relative h-64">
                            <img src="${product.image_url || product.image}" alt="${product.name}" 
                                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            ${product.tag ? `
                            <div class="absolute top-5 right-5 bg-white/90 backdrop-blur px-4 py-1 rounded-2xl text-xs font-bold text-brand shadow">
                                ${product.tag}
                            </div>` : ''}
                        </div>
                        <div class="p-7">
                            <h3 class="text-2xl font-bold text-gray-900 mb-2">${product.name}</h3>
                            <p class="text-3xl font-bold text-brand mb-4">${product.price}</p>
                            <p class="text-gray-600 leading-relaxed text-[15px] mb-8 line-clamp-3">
                                ${product.description || product.desc}
                            </p>
                            <a href="${waLink}" target="_blank"
                               class="block w-full text-center bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-semibold py-4 rounded-2xl transition shadow-lg shadow-green-500/30">
                                <i class="fa-brands fa-whatsapp mr-2"></i> Pesan Sekarang
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += html;
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === category) {
                    btn.classList.add('active', 'bg-brand', 'text-white', 'shadow-md');
                } else {
                    btn.classList.remove('active', 'bg-brand', 'text-white', 'shadow-md');
                }
            });

            if (category === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function showStatus(message, type = 'gray') {
            const status = document.getElementById('status');
            let bg = 'bg-gray-100 text-gray-600';
            if (type === 'green') bg = 'bg-green-100 text-green-700';
            if (type === 'yellow') bg = 'bg-yellow-100 text-yellow-700';
            if (type === 'red') bg = 'bg-red-100 text-red-700';

            status.innerHTML = `<span class="inline-flex items-center gap-2 px-6 py-3 rounded-3xl text-sm font-medium ${bg}">${message}</span>`;
        }

        // Start App
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 900, once: true });
            initSupabase();
        });
    </script>
</body>
</html>
